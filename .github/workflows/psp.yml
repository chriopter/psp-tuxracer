name: PSP build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install staging and test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick g++
      - name: Test numerical game code
        run: python3 tools/test-etr-numerics.py
      - name: Build PSP executable
        run: ./build-extremetuxracer.sh
      - name: Package game, licenses and corresponding sources
        run: python3 tools/package-extremetuxracer.py
      - name: Upload complete distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extremetuxracer-psp-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the complete build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: gh run download "$RUN_ID" --name "extremetuxracer-psp-$COMMIT" --dir dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "Extreme Tux Racer PSP $TAG" --notes "PSP build with game data, licenses and corresponding dependency sources. Tested in PPSSPP at 333 MHz; physical PSP performance is unverified."
